name: CI

on:
  push:
    branches: ["main", "phase1-*"]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve dependencies and refresh lockfile
        run: bun install

      - name: Commit refreshed lockfile on feature branch
        if: github.event_name == 'push' && github.ref_name != 'main'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync Bun lockfile"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Verify frozen lockfile install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build
