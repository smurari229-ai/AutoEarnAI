name: CI

on:
  push:
    branches: ["main", "phase1-*"]
  pull_request:

permissions:
  contents: read

jobs:
  sync-lockfile:
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate Bun lockfile
        run: bun install

      - name: Commit lockfile if changed
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync Bun lockfile"
          git push origin "HEAD:${BRANCH_NAME}"

  verify:
    if: ${{ always() && (needs.sync-lockfile.result == 'success' || needs.sync-lockfile.result == 'skipped') }}
    needs: sync-lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name != 'main' && github.ref_name || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build
