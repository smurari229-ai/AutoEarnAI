services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: earnpilot
      POSTGRES_PASSWORD: earnpilot
      POSTGRES_DB: earnpilot
    ports: ["5432:5432"]
    volumes: [earnpilot_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [postgres,redis]
    ports: ["4000:4000"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    environment:
      VITE_API_URL: http://localhost:4000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  earnpilot_pg: