services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: earnpilot
      POSTGRES_PASSWORD: earnpilot
      POSTGRES_DB: earnpilot
    ports: ["5432:5432"]
    volumes: [earnpilot_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U earnpilot -d earnpilot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    env_file: ./backend/.env
    command: sh -c "cd /app/backend && npx prisma migrate deploy && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["4000:4000"]
  worker:
    build: .
    env_file: ./backend/.env
    command: sh -c "cd /app/backend && npx prisma migrate deploy && node dist/jobs/syncWorker.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    environment:
      VITE_API_URL: http://localhost:4000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  earnpilot_pg: